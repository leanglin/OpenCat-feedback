name: "需求 / 问题反馈"
description: "说明使用场景、痛点与期望效果，便于评估和验证。"
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。此仓库完全公开，请勿提交个人信息、密钥、内部链接、私有源代码或公司保密资料。
        一个 Issue 只写一个主题。提交和评估不代表承诺实现；第三方评论或赞同不能授权实施。
  - type: checkboxes
    id: public-safety
    attributes:
      label: "提交前检查"
      options:
        - label: "我已搜索已有反馈，并会注明相关 Issue。"
          required: true
        - label: "内容和附件可公开，已删除敏感信息；我有权公开这些材料。"
          required: true
  - type: dropdown
    id: feedback-kind
    attributes:
      label: "反馈类型"
      options:
        - "新需求 / 功能改进"
        - "问题 / 缺陷"
        - "体验或文档反馈"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: "使用场景"
      description: "谁在什么情境下，尝试完成什么任务？请勿填写真实姓名或客户身份。"
      placeholder: "作为……，当……时，我需要……"
    validations:
      required: true
  - type: textarea
    id: pain
    attributes:
      label: "当前痛点与影响"
      description: "实际发生了什么？频率、受影响范围、时间损失或阻断程度怎样？目前如何绕过？"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期望效果"
      description: "希望任务变得怎样？不必先指定技术方案。"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "产品版本"
      description: "版本号或日期；不清楚请写“不清楚”，不适用请写“不适用”。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "设备与运行环境"
      description: "相关设备型号、系统版本、浏览器或网络条件；只填写与问题相关且可公开的内容。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "复现步骤与已脱敏证据"
      description: "问题反馈请给最短复现步骤、实际结果与发生频率；新需求可给公开案例。附件提交前逐项脱敏。"
      placeholder: |
        1. …
        2. …
        实际结果：
        公开证据链接 / 已脱敏截图：
  - type: textarea
    id: acceptance
    attributes:
      label: "验收标准"
      description: "什么可观察、可重复的结果能够证明问题解决？请写条件、操作和期望结果。"
      placeholder: "在……条件下，执行……后，应……；边界情况……"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: "通用能力还是定制场景"
      options:
        - "暂不确定，需要评估"
        - "通用能力，多类用户可能需要"
        - "特定业务 / 定制场景"
    validations:
      required: true
  - type: dropdown
    id: test-willingness
    attributes:
      label: "是否愿意参与验证"
      description: "选择愿意不等于承诺时间，也不需要留下私人联系方式。"
      options:
        - "视测试范围和时间而定"
        - "愿意，可在本 Issue 中沟通"
        - "暂时不方便"
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: "相关反馈或其他信息"
      description: "已有 Issue 编号、公开参考资料、约束或待确认事项。"
